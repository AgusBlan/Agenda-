<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Agenda</title>
<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<meta name="theme-color" content="#ffc7dd">
<link rel="manifest" href='data:application/manifest+json,[STRIPPED]'>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:#ffeef5;color:#5a3a4a}
.fondo-deco{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5}
.circulo{position:absolute;border-radius:50%}
.c1{width:120px;height:120px;background:radial-gradient(#ffc7dd 2px,transparent 3px);background-size:12px 12px;background-color:#fff;left:-20px;top:80px}
.c2{width:100px;height:100px;background:repeating-linear-gradient(45deg,#ffc7dd 0 4px,white 4px 10px);right:10px;top:400px}
.app{position:relative;z-index:2;max-width:1400px;margin:0 auto;padding:14px;padding-bottom:40px}
.top{text-align:center;background:#fff6f0;border-radius:20px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.08);border:3px solid #ffc7dd}
.top h1{margin:0;font-size:30px;color:#d96a96}
.card{background:white;border-radius:18px;padding:14px;margin-top:14px;box-shadow:0 4px 16px rgba(0,0,0,.06);border:2px solid #ffe3ee;position:relative}
.card-header{display:flex;justify-content:space-between;align-items:center;cursor:move}
.card-controls button{border:none;background:#ffe3ee;border-radius:50%;width:26px;height:26px;cursor:pointer;font-weight:bold;margin-left:4px}
input,select,textarea{width:100%;padding:10px;border-radius:12px;border:2px solid #ffc7dd;margin:6px 0;font-size:14px;background:white}
button.btn{width:100%;padding:12px;border:none;border-radius:14px;font-weight:bold;cursor:pointer;background:#ff8fb8;color:white;margin-top:6px}
button.small{width:auto;padding:8px 12px;font-size:12px}
.pill{display:inline-block;padding:9px 14px;border-radius:20px;background:#ffe3ee;font-size:13px;font-weight:bold;margin:3px;cursor:pointer}
.pill.seleccionado{background:#ff8fb8;color:white;outline:3px solid #fff;box-shadow:0 0 0 2px #ff8fb8}
.gridMesGrande{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.diaGrande{background:#fff6f0;border:2px solid #ffc7dd;border-radius:14px;padding:10px;min-height:110px;cursor:pointer;font-size:13px}
.diaGrande.seleccionado{outline:4px solid #ff8fb8;background:white}
.diaGrande.hoy{border:3px solid #d96a96}
.mesMini{background:white;border:2px solid #ffc7dd;border-radius:14px;padding:10px}
.mesMini h3{text-align:center;margin:0 0 8px}
.mesMiniGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;text-align:center}
.miniDia{padding:4px;border-radius:6px;cursor:pointer}
.miniDia.seleccionado{outline:3px solid #ff8fb8}
.tablaExcel{width:100%;border-collapse:collapse;background:white;border:2px solid #ffc7dd;border-radius:14px;overflow:hidden;font-size:12px}
.tablaExcel th{border:2px solid #ffc7dd;background:#ffc7dd;padding:10px;text-align:center}
.tablaExcel th:first-child{background:#ffe3ee}
.tablaExcel td{border:2px solid #ffdce8;padding:6px;vertical-align:top;min-width:95px}
.tablaExcel td:first-child{background:#fff6f0;font-weight:bold;color:#d96a96;text-align:center;width:65px}
.bar{height:12px;background:#eee;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:#ff8fb8}
canvas{width:100%;height:320px;background:white;border:2px dashed #ffc7dd;border-radius:14px;touch-action:none}
.cuadrados{display:flex;flex-direction:row;flex-wrap:nowrap;gap:10px;margin-top:14px;align-items:stretch;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.cuadro{flex:1 1 0;min-width:250px;max-width:33.3%;scroll-snap-align:start;transition:flex .35s;background:white;border-radius:18px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.06);border:2px solid #ffe3ee;cursor:pointer;overflow:hidden}
.cuadro.expandido{flex:2.2 1 0;max-width:55%}
.stick-note{position:relative;background:#fff0a8;padding:34px 16px 16px;border-radius:10px;box-shadow:0 8px 18px rgba(0,0,0,.18);font-size:17px;min-height:260px;transform:rotate(-1.5deg)}
.stick-note:nth-child(even){transform:rotate(1.5deg);background:#ffc7dd}
.stick-note .chinche{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.stick-note .cerrar{position:absolute;top:6px;right:6px;background:#ff8fb8;color:white;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer}
.stick-note .minim{position:absolute;top:6px;right:36px;background:white;border:1px solid #ffc7dd;border-radius:50%;width:24px;height:24px;cursor:pointer;font-weight:bold}
#minimizadosBar{position:fixed;bottom:16px;left:12px;z-index:70;display:flex;gap:8px;flex-wrap:wrap;max-width:90%}
.miniVentana{background:#fff0a8;border:2px solid #e8b800;border-radius:14px;padding:8px 10px;font-size:12px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;display:flex;gap:6px;align-items:center;max-width:180px}
.miniVentana span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.cuadrados{flex-direction:row;flex-wrap:nowrap;overflow-x:auto}.cuadro{min-width:260px;max-width:80%}.cuadro.expandido{flex:2.2 1 0;max-width:85%}.gridMesGrande{grid-template-columns:repeat(7,1fr);gap:4px}.diaGrande{min-height:70px;padding:5px;font-size:10px}.tablaExcel{font-size:10px}.tablaExcel td{min-width:70px}}
</style>
</head>
<body>
<div class="fondo-deco"><div class="circulo c1"></div><div class="circulo c2"></div></div>
<button onclick="toggleMenu()" style="position:fixed;top:12px;left:12px;z-index:100;background:#ff8fb8;color:white;border:none;width:50px;height:50px;border-radius:50%;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer">☰</button>
<div id="menuIzq" style="position:fixed;top:0;left:-270px;width:260px;height:100%;background:#fff6f0;z-index:99;padding:70px 14px 14px;box-shadow:4px 0 20px rgba(0,0,0,.15);transition:left .3s;border-right:3px solid #ffc7dd;overflow-y:auto">
<h3 style="margin:0;color:#d96a96">🌸 Mi Agenda</h3>
<button onclick="irA('cal');toggleMenu()" style="width:100%;padding:12px;border:none;border-radius:14px;background:#ffc7dd;font-weight:bold;margin:6px 0;text-align:left">📅 Calendario</button>
<button onclick="irA('acts');toggleMenu()" style="width:100%;padding:12px;border:none;border-radius:14px;background:#ffe3ee;font-weight:bold;margin:6px 0;text-align:left">✅ Actividades</button>
<button onclick="irA('bita');toggleMenu()" style="width:100%;padding:12px;border:none;border-radius:14px;background:#f8a9c4;color:white;font-weight:bold;margin:6px 0;text-align:left">💖 Bitácora</button>
<button onclick="irA('notas');toggleMenu()" style="width:100%;padding:12px;border:none;border-radius:14px;background:#e2c6ff;font-weight:bold;margin:6px 0;text-align:left">🧷 Stick Notes / NOTES</button>
<button onclick="irA('dibujo');toggleMenu()" style="width:100%;padding:12px;border:none;border-radius:14px;background:#a8e0ff;font-weight:bold;margin:6px 0;text-align:left">🎨 Dibujo</button>
<button onclick="irA('ajustes');toggleMenu()" style="width:100%;padding:12px;border:none;border-radius:14px;background:#ddd;font-weight:bold;margin:6px 0;text-align:left">🎀 Fondo</button>
<button onclick="toggleMenu()" style="width:100%;padding:10px;border:none;border-radius:12px;background:white;margin-top:14px">✕ Cerrar</button>
</div>
<div id="fondoOscuro" onclick="toggleMenu()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:98"></div>
<div id="capaAereos" style="position:fixed;inset:0;pointer-events:none;z-index:55"></div>
<button onclick="crearAereo()" style="position:fixed;bottom:18px;right:12px;z-index:60;background:#fff0a8;border:2px solid #e8b800;width:56px;height:56px;border-radius:50%;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer">📌</button>
<div id="minimizadosBar"></div>
<div class="app">
<div class="top"><h1>🌸 Mi Agenda</h1><p id="fechaTop"></p><p id="resumenTop"></p>
<div><span class="pill" id="pill-dia" onclick="setVista('dia')">DÍA</span><span class="pill" id="pill-semana" onclick="setVista('semana')">SEMANA</span><span class="pill" id="pill-mes" onclick="setVista('mes')">MES</span><span class="pill" id="pill-ano" onclick="setVista('ano')">AÑO</span></div>
<div style="display:flex;gap:6px;margin-top:10px"><button class="btn small" style="background:#ffc7dd;color:#333" onclick="cambiarFecha(-1)">◀</button><input type="date" id="fechaSel" onchange="render()"><button class="btn small" style="background:#ffc7dd;color:#333" onclick="cambiarFecha(1)">▶</button></div></div>

<div id="view-cal" class="view">
<div class="card movible" id="card-agenda"><div class="card-header"><b id="tituloAgenda">MIÉRCOLES 25</b><div class="card-controls"><button onclick="minimizarCard('card-agenda')">—</button><button onclick="cerrarCardPermanente('card-agenda')">✕</button></div></div><div class="card-body"><div id="calCont"></div><div id="panelEmocion" style="display:none;background:#fff6f0;padding:12px;border-radius:12px;margin-top:10px"><b id="diaSeleccionadoTxt">DÍA SELECCIONADO</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn small" style="background:#a8e0ff" onclick="pintarDia('tristeza','😢','#a8e0ff')">😢 Tristeza</button><button class="btn small" style="background:#fff0a8" onclick="pintarDia('felicidad','😊','#fff0a8')">😊 Felicidad</button><button class="btn small" style="background:#ffb8b8" onclick="pintarDia('enojo','😡','#ffb8b8')">😡 Enojo</button><button class="btn small" style="background:#e2c6ff" onclick="pintarDia('ansiedad','😰','#e2c6ff')">😰 Ansiedad</button><button class="btn small" style="background:#ffc7dd" onclick="pintarDia('tranquilidad','🥰','#ffc7dd')">🥰 Tranquilidad</button></div><button class="btn small" style="background:#ff8fb8;color:white;margin-top:8px" onclick="entrarDia()">Entrar al día ➜</button></div><button class="btn" onclick="mostrarFormAct()">+</button><div id="formAct" style="display:none"><input id="actTitulo" placeholder="• Hacer tal cosa..."><div style="display:flex;gap:6px"><input type="time" id="actHora1" value="14:00"><input type="time" id="actHora2" value="16:00"></div><input type="color" id="actColor" value="#ffc7dd"><select id="actRepetir"><option value="nunca">No se repite</option><option value="lunes">Todos los lunes</option><option value="martes">Todos los martes</option><option value="miercoles">Todos los miércoles</option><option value="jueves">Todos los jueves</option><option value="viernes">Todos los viernes</option><option value="sabado">Todos los sábados</option><option value="domingo">Todos los domingos</option><option value="dia">Todos los días</option></select><label style="font-size:12px">Hasta:</label><input type="date" id="actHasta"><button class="btn" onclick="agregarAct()">Guardar</button></div></div></div>

<div class="cuadrados">
<div class="cuadro" id="cuadro-todo" onclick="expandirCuadro('cuadro-todo')"><div class="card-header"><b>✅ TO DO LIST</b><div class="card-controls"><button onclick="event.stopPropagation();minimizarCuadro('cuadro-todo','TO DO LIST')">—</button><button onclick="event.stopPropagation();cerrarCuadroPermanente('cuadro-todo')">✕</button></div></div><div class="card-body"><div id="listaTodoBig"></div><div style="display:flex;gap:6px"><input id="todoRapido" placeholder="• Hacer tal cosa..." onclick="event.stopPropagation()"><button class="btn small" onclick="event.stopPropagation();agregarTodoRapido()">+</button></div></div></div>
<div class="cuadro" id="cuadro-fecha" onclick="expandirCuadro('cuadro-fecha')"><div class="card-header"><b>📍 Agendar fecha</b><div class="card-controls"><button onclick="event.stopPropagation();minimizarCuadro('cuadro-fecha','Agendar fecha')">—</button><button onclick="event.stopPropagation();cerrarCuadroPermanente('cuadro-fecha')">✕</button></div></div><div class="card-body"><input id="fechaNombre" placeholder="Ej: Entrega de TP, Aniversario, Turno..." onclick="event.stopPropagation()"><select id="fechaTipo" onclick="event.stopPropagation()"><option value="🎂">🎂 Cumpleaños</option><option value="📍">📍 Fecha</option><option value="📚">📚 Entrega / Examen</option><option value="💖">💖 Aniversario</option><option value="🩺">🩺 Turno</option><option value="⭐">⭐ Otro</option></select><button class="btn" style="background:#e8b800" onclick="event.stopPropagation();agregarFecha()">+</button><div id="listaFechas"></div></div></div>
<div class="cuadro" id="cuadro-notes" onclick="expandirCuadro('cuadro-notes')"><div class="card-header"><b>📝 NOTES</b><div class="card-controls"><button onclick="event.stopPropagation();minimizarCuadro('cuadro-notes','NOTES')">—</button><button onclick="event.stopPropagation();cerrarCuadroPermanente('cuadro-notes')">✕</button></div></div><div class="card-body"><textarea id="notaTexto" style="height:60px" placeholder="..." onclick="event.stopPropagation()"></textarea><button class="btn small" onclick="event.stopPropagation();agregarNota()">+</button><div id="listaNotasPreview"></div></div></div>
</div>
</div>

<div id="view-acts" class="view" style="display:none"><div class="card"><b>✅ Actividades</b><div id="listaActs"></div><div id="rendimiento"></div></div></div>
<div id="view-bita" class="view" style="display:none"><div class="card"><b>💖 Bitácora</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><button onclick="elegirEmocion('tristeza','😢','#a8e0ff')" style="padding:12px;border:3px solid #a8e0ff;border-radius:14px;background:#e0f4ff">😢<br>Tristeza</button><button onclick="elegirEmocion('felicidad','😊','#fff0a8')" style="padding:12px;border:3px solid #fff0a8;border-radius:14px;background:#fffef5">😊<br>Felicidad</button><button onclick="elegirEmocion('enojo','😡','#ffb8b8')" style="padding:12px;border:3px solid #ffb8b8;border-radius:14px;background:#ffe6e6">😡<br>Enojo</button><button onclick="elegirEmocion('ansiedad','😰','#e2c6ff')" style="padding:12px;border:3px solid #e2c6ff;border-radius:14px;background:#f3e8ff">😰<br>Ansiedad</button><button onclick="elegirEmocion('cansancio','😴','#dddddd')" style="padding:12px;border:3px solid #ddd;border-radius:14px;background:#f5f5f5">😴<br>Cansancio</button><button onclick="elegirEmocion('tranquilidad','🥰','#ffc7dd')" style="padding:12px;border:3px solid #ffc7dd;border-radius:14px;background:#ffe3ee">🥰<br>Tranquilidad</button></div><p id="emocionElegida" style="font-weight:bold;text-align:center">-</p>Energía <input type="range" min="1" max="5" id="bEnergia" value="3"> Foco <input type="range" min="1" max="5" id="bFoco" value="3"><textarea id="bTexto" placeholder="..."></textarea><button class="btn" onclick="guardarBitacora()">Guardar</button><p>MY RATING: <span id="ratingStars">☆☆☆☆☆</span> <button class="btn small" onclick="ponerRating()">Rating</button></p><div id="bitacoraMes"></div></div></div>
<div id="view-notas" class="view" style="display:none"><div class="card"><b>🧷 Stick Notes</b><div style="display:flex;gap:6px"><input id="notaTexto2" placeholder="Título de la note..."><button class="btn small" onclick="agregarNota2()">+</button></div><div id="listaNotas2" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px"></div></div></div>
<div id="view-dibujo" class="view" style="display:none"><div class="card"><b>🎨 Dibujo</b><div style="display:flex;gap:8px;align-items:center;margin:8px 0"><button onclick="usarLapiz()" id="btnLapiz" style="border:3px solid #ff8fb8;background:#ffe3ee;padding:10px;border-radius:50%;font-size:20px;cursor:pointer">✏️</button><button onclick="abrirGoma()" id="btnGoma" style="border:2px solid #ddd;background:white;padding:10px;border-radius:50%;font-size:20px;cursor:pointer">🧽</button><input type="color" id="colorDibujo" value="#ff8fb8" style="width:44px;height:44px;border-radius:50%;border:none;padding:0"><button class="btn small" onclick="limpiarCanvas()">Limpiar</button><button class="btn small" onclick="guardarDibujo()">Guardar</button></div><div id="panelGoma" style="display:none;background:#fff6f0;border:2px dashed #ffc7dd;border-radius:14px;padding:12px;margin-bottom:10px"><b>🧽 Goma</b><div style="display:flex;gap:6px;margin-top:8px"><button onclick="setGoma(8)" style="padding:8px 12px;border-radius:20px;border:2px solid #ffc7dd;background:white;cursor:pointer">• Chiquita</button><button onclick="setGoma(20)" style="padding:8px 12px;border-radius:20px;border:2px solid #ffc7dd;background:#ffe3ee;cursor:pointer">● Mediana</button><button onclick="setGoma(40)" style="padding:8px 12px;border-radius:20px;border:2px solid #ffc7dd;background:#ffc7dd;cursor:pointer">⬤ Grande</button></div><input type="range" id="tamGoma" min="4" max="60" value="20" oninput="setGoma(this.value)"><p id="tamGomaTxt" style="font-size:12px">Tamaño: 20</p><button class="btn small" style="background:#ddd;color:#333" onclick="cerrarGoma()">✕ Cerrar goma</button></div><canvas id="canvas"></canvas><div id="listaDibujos"></div></div></div>
<div id="view-ajustes" class="view" style="display:none"><div class="card"><b>🎀 Fondo</b><input type="file" accept="image/*" onchange="subirFondo(event)"><button class="btn" style="background:#ddd;color:#333" onclick="quitarFondo()">Quitar foto</button><button class="btn" onclick="exportar()">📤 Exportar</button><p id="exportBox" style="font-size:12px;white-space:pre-wrap"></p></div></div>
</div>

<script>
let acts=JSON.parse(localStorage.getItem('clef_acts')||'[]');let notas=JSON.parse(localStorage.getItem('clef_notas')||'[]');let bit=JSON.parse(localStorage.getItem('clef_bit')||'{}');let dibujos=JSON.parse(localStorage.getItem('clef_dib')||'[]');let fechas=JSON.parse(localStorage.getItem('clef_fechas')||'[]');let aereos=JSON.parse(localStorage.getItem('clef_aereos')||'[]');let minimizados=JSON.parse(localStorage.getItem('clef_minimizados')||'[]');let vista='mes';let fechaActual=new Date();fechaActual.setHours(0,0,0,0);let diaSeleccionado=null;let emocionHoy=null;let colorEmocionHoy='#ffc7dd';let iconoEmocionHoy='💖';let fondo=localStorage.getItem('clef_fondo');if(fondo)document.body.style.backgroundImage=`url(${fondo})`;
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toggleMenu(){let m=document.getElementById('menuIzq');let f=document.getElementById('fondoOscuro');if(m.style.left==='0px'){m.style.left='-270px';f.style.display='none';}else{m.style.left='0px';f.style.display='block';}}
function irA(v){show(v,null);}
function show(id,el){document.querySelectorAll('.view').forEach(v=>v.style.display='none');document.getElementById('view-'+id).style.display='block';render();if(id==='dibujo')initCanvas();}
function setVista(v){vista=v;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('seleccionado'));let el=document.getElementById('pill-'+v);if(el)el.classList.add('seleccionado');document.querySelectorAll('.view').forEach(x=>x.style.display='none');document.getElementById('view-cal').style.display='block';let m=document.getElementById('menuIzq');if(m)m.style.left='-270px';let f=document.getElementById('fondoOscuro');if(f)f.style.display='none';render();window.scrollTo(0,0);}
function cambiarFecha(n){fechaActual.setDate(fechaActual.getDate()+(vista==='mes'?n*30:vista==='ano'?n*365:vista==='semana'?n*7:n));render();}
function subirFondo(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{localStorage.setItem('clef_fondo',r.result);document.body.style.backgroundImage=`url(${r.result})`};r.readAsDataURL(f);}
function quitarFondo(){localStorage.removeItem('clef_fondo');document.body.style.backgroundImage='none';}
function ponerRating(){let r=prompt('1 al 5');if(!r)return;document.getElementById('ratingStars').innerText='★'.repeat(+r)+'☆'.repeat(5-+r);}
function elegirEmocion(n,i,c){emocionHoy=n;iconoEmocionHoy=i;colorEmocionHoy=c;let el=document.getElementById('emocionElegida');el.innerText=i+' '+n;el.style.background=c;el.style.padding='10px';el.style.borderRadius='12px';}
function mostrarFormAct(){let f=document.getElementById('formAct');f.style.display=f.style.display==='none'?'block':'none';}
function expandirCuadro(id){document.querySelectorAll('.cuadro').forEach(c=>c.classList.remove('expandido'));document.getElementById(id).classList.add('expandido');}
// MINIMIZAR POR COMPLETO -> queda ventanita chiquita visible
function minimizarCuadro(id,nombre){let el=document.getElementById(id);if(!el)return;el.style.display='none';if(!minimizados.find(x=>x.id===id)){minimizados.push({id:id,nombre:nombre||id});localStorage.setItem('clef_minimizados',JSON.stringify(minimizados));}renderMinimizados();}
function minimizarCard(id){minimizarCuadro(id, id==='card-agenda'?'Agenda':'Card');}
function cerrarCuadroPermanente(id){let el=document.getElementById(id);if(el)el.style.display='none';minimizados=minimizados.filter(x=>x.id!==id);localStorage.setItem('clef_minimizados',JSON.stringify(minimizados));renderMinimizados();}
function cerrarCardPermanente(id){cerrarCuadroPermanente(id);}
function reabrirMin(id){let el=document.getElementById(id);if(el)el.style.display='block';minimizados=minimizados.filter(x=>x.id!==id);localStorage.setItem('clef_minimizados',JSON.stringify(minimizados));renderMinimizados();}
function renderMinimizados(){let bar=document.getElementById('minimizadosBar');if(!bar)return;if(minimizados.length===0){bar.innerHTML='';return;}bar.innerHTML=minimizados.map(m=>`<div class="miniVentana" onclick="reabrirMin('${m.id}')"><span>📌 ${m.nombre}</span><b>＋</b></div>`).join('');}
function seleccionarDia(ks){diaSeleccionado=ks;fechaActual=new Date(ks+'T12:00:00');let panel=document.getElementById('panelEmocion');if(panel)panel.style.display='block';let t=document.getElementById('diaSeleccionadoTxt');if(t)t.innerText='DÍA SELECCIONADO: '+ks;render();}
function entrarDia(){if(!diaSeleccionado)return;vista='dia';render();let p=document.getElementById('panelEmocion');if(p)p.style.display='none';window.scrollTo(0,0);}
function pintarDia(n,i,c){let k=diaSeleccionado||fmt(fechaActual);bit[k]={emocion:n,icono:i,color:c,energia:3,foco:3,texto:''};localStorage.setItem('clef_bit',JSON.stringify(bit));render();}
function agregarTodoRapido(){let t=document.getElementById('todoRapido').value.trim();if(!t)return;acts.push({id:Date.now(),titulo:t,fecha:fmt(fechaActual),h1:'12:00',h2:'13:00',color:'#ffc7dd',repetir:'nunca',hasta:'',hecha:false});localStorage.setItem('clef_acts',JSON.stringify(acts));document.getElementById('todoRapido').value='';render();}
function agregarAct(){let t=document.getElementById('actTitulo').value.trim();if(!t)return;let a={id:Date.now(),titulo:t,fecha:fmt(fechaActual),h1:document.getElementById('actHora1').value,h2:document.getElementById('actHora2').value,color:document.getElementById('actColor').value,repetir:document.getElementById('actRepetir').value,hasta:document.getElementById('actHasta').value,hecha:false};acts.push(a);localStorage.setItem('clef_acts',JSON.stringify(acts));document.getElementById('actTitulo').value='';document.getElementById('formAct').style.display='none';render();}
function actsParaFecha(fs){let d=new Date(fs+'T12:00:00');return acts.filter(a=>{if(a.fecha===fs)return true;if(a.hasta&&fs>a.hasta)return false;if(fs<a.fecha)return false;if(a.repetir==='dia')return true;if(a.repetir==='semana')return new Date(a.fecha+'T12:00:00').getDay()===d.getDay();let dias={lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6,domingo:0};if(dias[a.repetir]!==undefined)return d.getDay()===dias[a.repetir];return false;});}
function toggleAct(id){let a=acts.find(x=>x.id===id);if(a)a.hecha=!a.hecha;localStorage.setItem('clef_acts',JSON.stringify(acts));render();}
function borrarAct(id){acts=acts.filter(x=>x.id!==id);localStorage.setItem('clef_acts',JSON.stringify(acts));render();}
function agregarNota(){let t=document.getElementById('notaTexto').value.trim();if(!t)return;notas.unshift({id:Date.now(),titulo:t,texto:'',fecha:fmt(new Date()),minimizada:false,subs:[]});localStorage.setItem('clef_notas',JSON.stringify(notas));document.getElementById('notaTexto').value='';render();}
function agregarNota2(){let t=document.getElementById('notaTexto2').value.trim();if(!t)return;notas.unshift({id:Date.now(),titulo:t,texto:'',fecha:fmt(new Date()),minimizada:false,subs:[]});localStorage.setItem('clef_notas',JSON.stringify(notas));document.getElementById('notaTexto2').value='';render();}
function cambiarTextoNota(id,valor){let n=notas.find(x=>x.id===id);if(n){n.texto=valor;localStorage.setItem('clef_notas',JSON.stringify(notas));}}
function agregarSubNota(id){let inp=document.getElementById('sub-'+id);let v=inp.value.trim();if(!v)return;let n=notas.find(x=>x.id===id);if(!n.subs)n.subs=[];n.subs.push(v);localStorage.setItem('clef_notas',JSON.stringify(notas));render();}
function borrarSubNota(id,idx){let n=notas.find(x=>x.id===id);if(n&&n.subs){n.subs.splice(idx,1);localStorage.setItem('clef_notas',JSON.stringify(notas));render();}}
function minimizarNota(id){let n=notas.find(x=>x.id===id);if(n){n.minimizada=!n.minimizada;localStorage.setItem('clef_notas',JSON.stringify(notas));render();}}
function cerrarNota(id){notas=notas.filter(x=>x.id!==id);localStorage.setItem('clef_notas',JSON.stringify(notas));render();}
function borrarNota(id){cerrarNota(id);}
function agregarFecha(){let n=document.getElementById('fechaNombre').value.trim();if(!n)return;let tipo=document.getElementById('fechaTipo').value;fechas.push({id:Date.now(),nombre:n,tipo:tipo,fecha:fmt(fechaActual)});localStorage.setItem('clef_fechas',JSON.stringify(fechas));document.getElementById('fechaNombre').value='';render();}
function borrarFecha(id){fechas=fechas.filter(x=>x.id!==id);localStorage.setItem('clef_fechas',JSON.stringify(fechas));render();}
function guardarBitacora(){let k=fmt(fechaActual);bit[k]={emocion:emocionHoy||'tranquilidad',icono:iconoEmocionHoy,color:colorEmocionHoy,energia:+document.getElementById('bEnergia').value,foco:+document.getElementById('bFoco').value,texto:document.getElementById('bTexto').value};localStorage.setItem('clef_bit',JSON.stringify(bit));render();}
function exportar(){let txt='MI MES\n';Object.keys(bit).forEach(k=>{txt+=k+' '+bit[k].icono+' '+bit[k].emocion+' - '+bit[k].texto+'\n'});txt+='\nFECHAS:\n'+fechas.map(f=>f.fecha+' '+f.tipo+' '+f.nombre).join('\n');document.getElementById('exportBox').innerText=txt;}
// STICKY AÉREO - SIN CARTEL, SE ABRE DIRECTO Y ESCRIBÍS
function crearAereo(){
  let a={id:Date.now(),titulo:'',texto:'',x:60+Math.random()*120,y:120+Math.random()*180,minimizado:false};
  aereos.push(a);localStorage.setItem('clef_aereos',JSON.stringify(aereos));renderAereos();
  setTimeout(()=>{let inp=document.querySelector(`[data-aereo-titulo="${a.id}"]`);if(inp)inp.focus();},100);
}
function cambiarTituloAereo(id,valor){let a=aereos.find(x=>x.id===id);if(a){a.titulo=valor;localStorage.setItem('clef_aereos',JSON.stringify(aereos));}}
function cambiarTextoAereo(id,valor){let a=aereos.find(x=>x.id===id);if(a){a.texto=valor;localStorage.setItem('clef_aereos',JSON.stringify(aereos));}}
function minimizarAereo(id){let a=aereos.find(x=>x.id===id);if(a){a.minimizado=true;localStorage.setItem('clef_aereos',JSON.stringify(aereos));renderAereos();renderMinimizados();}}
function reabrirAereo(id){let a=aereos.find(x=>x.id===id);if(a){a.minimizado=false;localStorage.setItem('clef_aereos',JSON.stringify(aereos));renderAereos();renderMinimizados();}}
function cerrarAereoPermanente(id){aereos=aereos.filter(x=>x.id!==id);localStorage.setItem('clef_aereos',JSON.stringify(aereos));renderAereos();renderMinimizados();}
function renderAereos(){
  let capa=document.getElementById('capaAereos');if(!capa)return;capa.innerHTML='';
  aereos.forEach(a=>{
    if(a.minimizado) return;
    let d=document.createElement('div');
    d.style.cssText=`position:absolute;left:${a.x}px;top:${a.y}px;width:230px;min-height:200px;background:#fff0a8;padding:30px 12px 12px;border-radius:10px;box-shadow:0 8px 18px rgba(0,0,0,.25);transform:rotate(-1.5deg);pointer-events:auto;touch-action:none;cursor:move`;
    d.innerHTML=`<span style="position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:26px">📌</span><div style="position:absolute;top:6px;right:6px;display:flex;gap:4px"><button onclick="minimizarAereo(${a.id})" style="background:white;border:1px solid #ffc7dd;border-radius:50%;width:24px;height:24px;cursor:pointer;font-weight:bold">—</button><button onclick="cerrarAereoPermanente(${a.id})" style="background:#ff8fb8;color:white;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer">✕</button></div><input data-aereo-titulo="${a.id}" value="${(a.titulo||'').replace(/"/g,'')}" oninput="cambiarTituloAereo(${a.id},this.value)" placeholder="Título..." style="background:transparent;border:none;border-bottom:1px dashed #e8b800;font-weight:bold;font-size:15px;padding:4px"><textarea oninput="cambiarTextoAereo(${a.id},this.value)" placeholder="Escribí acá..." style="width:100%;height:90px;margin-top:8px;background:rgba(255,255,255,.6);border:1px dashed #e8b800;border-radius:8px;padding:8px;font-size:14px">${a.texto||''}</textarea>`;
    let sx,sy,ox,oy;let mover=e=>{let t=e.touches?e.touches[0]:e;a.x=ox+(t.clientX-sx);a.y=oy+(t.clientY-sy);d.style.left=a.x+'px';d.style.top=a.y+'px';};let soltar=()=>{localStorage.setItem('clef_aereos',JSON.stringify(aereos));document.removeEventListener('mousemove',mover);document.removeEventListener('mouseup',soltar);};d.onmousedown=e=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;sx=e.clientX;sy=e.clientY;ox=a.x;oy=a.y;document.addEventListener('mousemove',mover);document.addEventListener('mouseup',soltar);};d.ontouchstart=e=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;let t=e.touches[0];sx=t.clientX;sy=t.clientY;ox=a.x;oy=a.y;};d.ontouchmove=e=>{e.preventDefault();mover(e);};d.ontouchend=()=>{localStorage.setItem('clef_aereos',JSON.stringify(aereos));};capa.appendChild(d);
  });
  let bar=document.getElementById('minimizadosBar');if(!bar)return;
  let mins=[...minimizados];
  aereos.forEach(a=>{if(a.minimizado) mins.push({id:'aereo-'+a.id,nombre:a.titulo||'Sticky',aereoId:a.id});});
  bar.innerHTML=mins.map(m=>m.aereoId?`<div class="miniVentana" onclick="reabrirAereo(${m.aereoId})"><span>📌 ${m.nombre||'Sticky'}</span><b>＋</b></div>`:`<div class="miniVentana" onclick="reabrirMin('${m.id}')"><span>📌 ${m.nombre}</span><b>＋</b></div>`).join('');
}
let ctx,dibujando=false,modo='lapiz',tamGoma=20,tamLapiz=4;
function usarLapiz(){modo='lapiz';document.getElementById('btnLapiz').style.border='3px solid #ff8fb8';document.getElementById('btnGoma').style.border='2px solid #ddd';document.getElementById('panelGoma').style.display='none';let cv=document.getElementById('canvas');if(cv)cv.style.cursor='crosshair';}
function abrirGoma(){modo='goma';document.getElementById('btnGoma').style.border='3px solid #ff8fb8';document.getElementById('btnLapiz').style.border='2px solid #ddd';document.getElementById('panelGoma').style.display='block';let cv=document.getElementById('canvas');if(cv)cv.style.cursor='cell';}
function cerrarGoma(){usarLapiz();}
function setGoma(t){tamGoma=+t;document.getElementById('tamGoma').value=tamGoma;document.getElementById('tamGomaTxt').innerText='Tamaño: '+tamGoma;}
function initCanvas(){let c=document.getElementById('canvas');if(!c||ctx)return;ctx=c.getContext('2d');c.width=c.offsetWidth;c.height=320;let pos=e=>{let r=c.getBoundingClientRect();let t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};let empezar=e=>{dibujando=true;ctx.beginPath();let p=pos(e);ctx.moveTo(p.x,p.y);};let mover=e=>{if(!dibujando)return;let p=pos(e);if(modo==='goma'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=tamGoma;}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=document.getElementById('colorDibujo').value;ctx.lineWidth=tamLapiz;}ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);};let terminar=()=>{dibujando=false;ctx.beginPath();ctx.globalCompositeOperation='source-over';};c.onmousedown=empezar;c.onmousemove=mover;window.onmouseup=terminar;c.ontouchstart=e=>{e.preventDefault();empezar(e);};c.ontouchmove=e=>{e.preventDefault();mover(e);};c.ontouchend=terminar;}
function limpiarCanvas(){if(ctx)ctx.clearRect(0,0,document.getElementById('canvas').width,320);}
function guardarDibujo(){let u=document.getElementById('canvas').toDataURL();dibujos.unshift(u);localStorage.setItem('clef_dib',JSON.stringify(dibujos));render();}
function borrarDibujo(i){dibujos.splice(i,1);localStorage.setItem('clef_dib',JSON.stringify(dibujos));render();}
document.querySelectorAll('.movible').forEach(card=>{let h=card.querySelector('.card-header');if(!h)return;h.onmousedown=e=>{if(e.target.tagName==='BUTTON')return;let sx=e.clientX,sy=e.clientY;let mover=ev=>{card.style.position='relative';card.style.left=(ev.clientX-sx)+'px';card.style.top=(ev.clientY-sy)+'px';};let up=()=>{document.removeEventListener('mousemove',mover);document.removeEventListener('mouseup',up);};document.addEventListener('mousemove',mover);document.addEventListener('mouseup',up);};});

document.getElementById('listaTodoBig').innerHTML=acts.map(a=>{let s=a.hecha?'✓':'✕';let col=a.hecha?'#b8f1cc':'#ffb8b8';return `<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #ffdce8"><button onclick="toggleAct(${a.id})" style="width:28px;height:28px;border:2px solid ${col};background:${col};border-radius:6px;font-weight:bold;cursor:pointer;font-size:15px">${s}</button><span style="flex:1;${a.hecha?'text-decoration:line-through;opacity:.5':''}">• ${a.titulo} - ${a.fecha} ${a.h1}</span><span onclick="borrarAct(${a.id})" style="cursor:pointer">✕</span></div>`}).join('')||'—';
document.getElementById('listaFechas').innerHTML=fechas.filter(f=>new Date(f.fecha+'T12:00:00').getMonth()===fechaActual.getMonth()).map(f=>`${f.tipo} ${f.nombre} - ${f.fecha} <button onclick="borrarFecha(${f.id})" style="border:none;background:#ff8fb8;color:white;border-radius:50%;width:20px;height:20px;cursor:pointer">✕</button>`).join('<br>')||'—';
document.getElementById('listaActs').innerHTML=acts.map(a=>{let s=a.hecha?'✓':'✕';let col=a.hecha?'#b8f1cc':'#ffb8b8';return `<div style="display:flex;justify-content:space-between;background:#fff6f0;padding:10px;border-radius:10px;margin:5px 0"><span><button onclick="toggleAct(${a.id})" style="width:26px;height:26px;border:2px solid ${col};background:${col};border-radius:6px;font-weight:bold;cursor:pointer">${s}</button> • ${a.titulo} - ${a.fecha} ${a.h1}</span><span onclick="borrarAct(${a.id})">✕</span></div>`}).join('')||'—';let total=acts.length;let cumpli=total?Math.round(hechas/total*100):0;document.getElementById('rendimiento').innerHTML=`<b>Rendimiento:</b> ${cumpli}% (${hechas}/${total})<div class="bar"><div style="width:${cumpli}%"></div></div>`;let keys=Object.keys(bit);let prom=k=>keys.length?(keys.reduce((s,kk)=>s+bit[kk][k],0)/keys.length).toFixed(1):'-';document.getElementById('bitacoraMes').innerHTML=`<hr><b>Promedio:</b> Energía ${prom('energia')} • Foco ${prom('foco')}<br>${keys.map(k=>`<div style="font-size:13px;padding:6px;background:${bit[k].color};border-radius:8px;margin:4px 0"><b>${k}</b> ${bit[k].icono} ${bit[k].emocion} - ${bit[k].texto}</div>`).join('')}`;
document.getElementById('listaNotasPreview').innerHTML=notas.slice(0,3).map(n=>`<div style="background:#fff0a8;padding:6px;border-radius:8px;margin:4px 0;font-size:12px;display:flex;justify-content:space-between">${n.titulo} <button onclick="borrarNota(${n.id})" style="border:none;background:#ff8fb8;color:white;border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:10px">✕</button></div>`).join('');
document.getElementById('listaNotas2').innerHTML=notas.map(n=>`<div class="stick-note"><span class="chinche">📌</span><button class="minim" onclick="minimizarNota(${n.id})">—</button><button class="cerrar" onclick="cerrarNota(${n.id})">✕</button><b style="font-size:18px">${n.titulo}</b>${n.minimizada?'':`<textarea oninput="cambiarTextoNota(${n.id},this.value)" placeholder="Tocá acá y escribí adentro..." style="width:100%;height:110px;margin-top:10px;background:rgba(255,255,255,.6);border:1px dashed #e8b800;border-radius:10px;padding:10px;font-size:15px">${n.texto||''}</textarea><div style="display:flex;gap:6px;margin-top:8px"><input id="sub-${n.id}" placeholder="• Agregar cosa adentro..." style="flex:1;padding:8px;font-size:13px" onkeydown="if(event.key==='Enter'){agregarSubNota(${n.id})}"><button onclick="agregarSubNota(${n.id})" style="background:#ff8fb8;color:white;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:bold">+</button></div><div>${(n.subs||[]).map((s,i)=>`<div style="display:flex;justify-content:space-between;background:white;padding:6px 8px;border-radius:8px;margin-top:6px;font-size:14px"><span>• ${s}</span><button onclick="borrarSubNota(${n.id},${i})" style="border:none;background:transparent;cursor:pointer">✕</button></div>`).join('')}</div><small style="opacity:.6">${n.fecha}</small>`}</div>`).join('');
document.getElementById('listaDibujos').innerHTML=dibujos.map((u,i)=>`<div style="position:relative"><img src="${u}" style="width:100%;border-radius:12px;margin:6px 0"><button onclick="borrarDibujo(${i})" style="position:absolute;top:10px;right:10px;background:#ff8fb8;color:white;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer">✕</button></div>`).join('');
if(diaSeleccionado){let p=document.getElementById('panelEmocion');if(p){p.style.display='block';let t=document.getElementById('diaSeleccionadoTxt');if(t)t.innerText='DÍA SELECCIONADO: '+diaSeleccionado;}}
minimizados.forEach(m=>{let el=document.getElementById(m.id);if(el)el.style.display='none';});renderMinimizados();renderAereos();}
function pintarDia(n,i,c){let k=diaSeleccionado||fmt(fechaActual);bit[k]={emocion:n,icono:i,color:c,energia:3,foco:3,texto:''};localStorage.setItem('clef_bit',JSON.stringify(bit));render();}
render();setVista('mes');renderMinimizados();renderAereos();
</script>
</body>
</html>
